[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "failuremodes"
version = "0.1.0"
description = "Failure-mode characterization of BP decoding on degenerate quantum LDPC codes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "torch",
]

[tool.setuptools.packages.find]
where = ["src"]
